# Host kernel settings for ROS 2 DDS with large messages (camera images).
# To install on the HOST (not in the container, the container shares the host kernel):
#   sudo cp robots/mantis/10-ros-dds.conf /etc/sysctl.d/ && sudo sysctl --system
# Ref: https://docs.ros.org/en/jazzy/How-To-Guides/DDS-tuning.html

# Allow DDS to request large socket receive buffers (cyclonedds.xml asks for 64 MB)
net.core.rmem_max=2147483647

# IP fragment reassembly: drop incomplete fragments faster, allow more memory for reassembly
net.ipv4.ipfrag_time=3
net.ipv4.ipfrag_high_thresh=134217728
